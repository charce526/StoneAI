name: Bug 报告
description: 报告可复现的应用问题
title: "[Bug] "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: 请勿提交 API Key、精确位置、私人照片或其他敏感信息。
  - type: input
    id: version
    attributes:
      label: 应用版本
      placeholder: 例如 1.1.0
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: 设备与 Android 版本
      placeholder: 例如 Pixel 8 / Android 16
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: 复现步骤
      placeholder: 请按顺序列出操作步骤
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: 预期行为
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: 实际行为
    validations:
      required: true
  - type: textarea
    id: additional
    attributes:
      label: 补充信息
      description: 可以提供已脱敏的日志或截图。
